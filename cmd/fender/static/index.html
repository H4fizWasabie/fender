<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fender</title>
<style>
  body { margin: 0; font-family: ui-monospace, monospace; background: #111; color: #ddd; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .user { color: #7ec8ff; margin: 8px 0 2px; }
  .assistant { white-space: pre-wrap; margin: 2px 0 12px; }
  .thinking { color: #666; font-style: italic; white-space: pre-wrap; }
  .tool { color: #999; margin: 4px 0; }
  .status { color: #4caf50; }
  .status.error { color: #f44336; }
  .status.blocked { color: #ffc107; }
  #inputbar { display: flex; border-top: 1px solid #333; }
  #input { flex: 1; background: #1a1a1a; color: #ddd; border: 0; padding: 14px; font: inherit; outline: none; }
  #send { background: #2a6; color: #111; border: 0; padding: 0 20px; font: inherit; cursor: pointer; }
  #send:disabled { background: #444; cursor: wait; }
  h1 { font-size: 14px; padding: 8px 16px; border-bottom: 1px solid #333; color: #888; }
</style>
</head>
<body>
<h1>fender — dashboard</h1>
<div id="log"></div>
<div id="inputbar">
  <input id="input" placeholder="type a task…" autofocus>
  <button id="send">send</button>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');

function append(cls, text) {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// SSE: live observer events
const es = new EventSource('/api/events');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  switch (ev.kind) {
    case 'delta': append('assistant', ev.text); break;
    case 'thinking': append('thinking', ev.text); break;
    case 'tool': append('tool', '[tool ' + ev.text + ': ' + (ev.status || 'ok') + ']'); break;
    case 'done':
      append('status' + (ev.status === 'complete' ? '' : '.' + ev.status), '<' + ev.status + '>');
      if (ev.text) append('assistant', ev.text); // reply via complete_task args
      send.disabled = false;
      break;
  }
};

async function submit() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  append('user', text);
  send.disabled = true;
  await fetch('/api/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  });
}
send.onclick = submit;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
