name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Changelog check
        run: |
          # every commit must touch CHANGELOG.md (constitution rule)
          if git diff --name-only ${{ github.event.before }} HEAD | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md updated ✓"
          else
            echo "::warning::CHANGELOG.md not touched since last commit — constitution requires it"
          fi
